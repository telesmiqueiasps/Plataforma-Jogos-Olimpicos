<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/logo.ico" type="image/x-icon">
  <title>Jogos Sinodal Paraíba 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; min-height: 100vh;
           background: #f8fafc; }
    @keyframes floatImg {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes shimmerBg {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes goldShimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes sparkleRise {
      0%   { opacity: 0; transform: translateY(0) scale(0.5); }
      25%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-44px) scale(0.2); }
    }
    @keyframes waveScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div style="background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#1d4ed8 100%);padding:20px 20px 18px;">
    <div style="display:flex;align-items:center;justify-content:center;
                gap:12px;">
      <img src="img/logo.png" alt="Logo"
        style="width:40px;height:40px;object-fit:contain;
               border-radius:50%;border:2px solid rgba(255,255,255,0.3);"
        onerror="this.style.display='none'">
      <div style="text-align:left;">
        <h1 style="color:white;font-size:20px;font-weight:800;margin:0;
                   letter-spacing:-0.5px;line-height:1.2;">
          Jogos Sinodal PB
        </h1>
        <p style="color:rgba(255,255,255,0.7);font-size:12px;margin:0;">
          2026
        </p>
      </div>
    </div>
  </div>

  <!-- Patrocinadores -->
  <div style="max-width:480px;margin:0 auto 14px;padding:0 16px;">

    <!-- Cards empilhados — só um visível por vez -->
    <div style="position:relative;min-height:170px;" id="sponsors-wrapper">

      <div id="scard-0" class="scard" style="position:absolute;inset:0;
           opacity:1;transition:opacity 0.6s ease, transform 0.6s ease;
           transform:scale(1);"></div>

      <div id="scard-1" class="scard" style="position:absolute;inset:0;
           opacity:0;transition:opacity 0.6s ease, transform 0.6s ease;
           transform:scale(0.97);pointer-events:none;"></div>

      <div id="scard-2" class="scard" style="position:absolute;inset:0;
           opacity:0;transition:opacity 0.6s ease, transform 0.6s ease;
           transform:scale(0.97);pointer-events:none;"></div>

    </div>

    <!-- Botões de navegação -->
    <div style="display:flex;justify-content:center;gap:8px;margin-top:10px;">
      <button onclick="showSponsor(0)" id="snav-0"
        style="padding:6px 14px;border-radius:20px;border:none;cursor:pointer;
               font-size:11px;font-weight:700;letter-spacing:0.5px;
               transition:all 0.3s;">
        🥇 OURO
      </button>
      <button onclick="showSponsor(1)" id="snav-1"
        style="padding:6px 14px;border-radius:20px;border:none;cursor:pointer;
               font-size:11px;font-weight:700;letter-spacing:0.5px;
               transition:all 0.3s;">
        🥈 PRATA
      </button>
      <button onclick="showSponsor(2)" id="snav-2"
        style="padding:6px 14px;border-radius:20px;border:none;cursor:pointer;
               font-size:11px;font-weight:700;letter-spacing:0.5px;
               transition:all 0.3s;">
        🥉 BRONZE
      </button>
    </div>

    <div style="height:1px;background:#e2e8f0;margin:28px 0;"></div>

  </div>

  <!-- Cards de navegação -->
  <div style="max-width:480px;margin:0 auto;padding:0 16px 8px;">

    <!-- Campeonatos -->
    <a href="public.html" style="text-decoration:none;display:block;margin-bottom:10px;">
      <div style="background:white;border-radius:14px;padding:16px;
                  display:flex;align-items:center;gap:14px;
                  box-shadow:0 4px 20px rgba(0,0,0,0.15);
                  transition:transform 0.2s;"
           onmouseover="this.style.transform='translateY(-2px)'"
           onmouseout="this.style.transform='translateY(0)'">
        <div style="width:48px;height:48px;background:#eff6ff;border-radius:12px;
                    display:flex;align-items:center;justify-content:center;
                    flex-shrink:0;">
          <img src="img/campeonatos.png" alt="Campeonatos" style="width:30px;height:30px;object-fit:contain;">
        </div>
        <div>
          <div style="font-weight:700;font-size:15px;color:#1e293b;">Campeonatos</div>
          <div style="color:#64748b;font-size:12px;margin-top:2px;">
            Tabelas, jogos e classificação
          </div>
        </div>
        <div style="margin-left:auto;color:#94a3b8;font-size:20px;">›</div>
      </div>
    </a>

    <!-- Cantina PDV 1 -->
    <a href="cantina-menu.html?pdv=1" style="text-decoration:none;display:block;margin-bottom:10px;">
      <div style="background:white;border-radius:14px;padding:16px;
                  display:flex;align-items:center;gap:14px;
                  box-shadow:0 4px 20px rgba(0,0,0,0.15);
                  transition:transform 0.2s;"
           onmouseover="this.style.transform='translateY(-2px)'"
           onmouseout="this.style.transform='translateY(0)'">
        <div style="width:48px;height:48px;background:#f0fdf4;border-radius:12px;
                    display:flex;align-items:center;justify-content:center;
                    flex-shrink:0;">
          <img src="img/cantina.png" alt="Cantina" style="width:30px;height:30px;object-fit:contain;">
        </div>
        <div>
          <div id="pdv1-name" style="font-weight:700;font-size:15px;color:#1e293b;">
            Cantina PDV 1
          </div>
          <div style="color:#64748b;font-size:12px;margin-top:2px;">
            Ver cardápio e fazer reserva
          </div>
        </div>
        <div style="margin-left:auto;color:#94a3b8;font-size:20px;">›</div>
      </div>
    </a>

    <!-- Cantina PDV 2 -->
    <a href="cantina-menu.html?pdv=2" style="text-decoration:none;display:block;margin-bottom:16px;">
      <div style="background:white;border-radius:14px;padding:16px;
                  display:flex;align-items:center;gap:14px;
                  box-shadow:0 4px 20px rgba(0,0,0,0.15);
                  transition:transform 0.2s;"
           onmouseover="this.style.transform='translateY(-2px)'"
           onmouseout="this.style.transform='translateY(0)'">
        <div style="width:48px;height:48px;background:#fef3c7;border-radius:12px;
                    display:flex;align-items:center;justify-content:center;
                    flex-shrink:0;">
          <img src="img/cantina.png" alt="Cantina" style="width:30px;height:30px;object-fit:contain;">
        </div>
        <div>
          <div id="pdv2-name" style="font-weight:700;font-size:15px;color:#1e293b;">
            Cantina PDV 2
          </div>
          <div style="color:#64748b;font-size:12px;margin-top:2px;">
            Ver cardápio e fazer reserva
          </div>
        </div>
        <div style="margin-left:auto;color:#94a3b8;font-size:20px;">›</div>
      </div>
    </a>

  </div>

  <!-- Botão de feedback -->
  <div style="text-align:center;padding:0 20px 12px;">
    <button onclick="openFeedbackModal()"
      style="background:transparent;border:1px solid rgba(30,58,138,0.2);color:#475569;padding:10px 24px;border-radius:20px;font-size:13px;cursor:pointer;letter-spacing:0.3px;transition:all 0.2s;"
      onmouseover="this.style.background='#eff6ff';this.style.color='#1e3a8a'"
      onmouseout="this.style.background='transparent';this.style.color='#475569'">
      💬 Deixe aqui o seu feedback sobre a plataforma
    </button>
  </div>

  <!-- Footer -->
  <div style="text-align:center;padding:8px 16px 10px;color:#94a3b8;font-size:11px;">
    Desenvolvido por Miquéias Teles
  </div>

  <!-- Ondas decorativas -->
  <div style="position:relative;height:72px;overflow:hidden;">
    <svg style="position:absolute;bottom:0;left:0;width:200%;height:100%;animation:waveScroll 18s linear infinite;" preserveAspectRatio="none" viewBox="0 0 2880 72">
      <path d="M0,36 C240,72 480,0 720,36 C960,72 1200,0 1440,36 C1680,72 1920,0 2160,36 C2400,72 2640,0 2880,36 L2880,72 L0,72 Z" fill="#1e3a8a" fill-opacity="0.18"/>
    </svg>
    <svg style="position:absolute;bottom:0;left:0;width:200%;height:100%;animation:waveScroll 12s linear infinite 0.8s reverse;" preserveAspectRatio="none" viewBox="0 0 2880 72">
      <path d="M0,48 C360,8 720,68 1080,28 C1440,68 1800,8 2160,48 C2520,68 2880,14 2880,48 L2880,72 L0,72 Z" fill="#2563eb" fill-opacity="0.15"/>
    </svg>
    <svg style="position:absolute;bottom:0;left:0;width:200%;height:100%;animation:waveScroll 8s linear infinite 1.6s;" preserveAspectRatio="none" viewBox="0 0 2880 72">
      <path d="M0,54 C480,18 960,68 1440,38 C1920,8 2400,62 2880,54 L2880,72 L0,72 Z" fill="#3b82f6" fill-opacity="0.12"/>
    </svg>
    <svg style="position:absolute;bottom:0;left:0;width:200%;height:100%;animation:waveScroll 22s linear infinite 2s reverse;" preserveAspectRatio="none" viewBox="0 0 2880 72">
      <path d="M0,60 C600,30 1200,72 1800,45 C2400,18 2880,58 2880,60 L2880,72 L0,72 Z" fill="#1d4ed8" fill-opacity="0.1"/>
    </svg>
  </div>

  <!-- Modal de feedback -->
  <div id="feedback-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:20px;">
    <div style="background:white;border-radius:16px;width:100%;max-width:440px;overflow:hidden;">
      <!-- Header -->
      <div style="background:#2563eb;padding:20px 20px 16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="color:white;font-weight:700;font-size:16px;">💬 Feedback</div>
            <div style="color:rgba(255,255,255,0.75);font-size:12px;margin-top:2px;">Faz parte do meu portfólio. obrigado! 🙂</div>
          </div>
          <button onclick="closeFeedbackModal()"
            style="background:rgba(255,255,255,0.2);border:none;color:white;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;">
            ✕
          </button>
        </div>
      </div>
      <!-- Body -->
      <div id="feedback-modal-body" style="padding:20px;">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">Seu nome</label>
            <input type="text" id="fb-name" maxlength="100" placeholder="Como posso te chamar?"
              style="width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:14px;color:#374151;background:#f8fafc;outline:none;box-sizing:border-box;"
              onfocus="this.style.borderColor='#2563eb'"
              onblur="this.style.borderColor='#e2e8f0'">
          </div>
          <div>
            <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">Seu feedback</label>
            <textarea id="fb-message" maxlength="500" placeholder="O que achou da plataforma?" rows="4"
              style="width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:14px;color:#374151;background:#f8fafc;outline:none;box-sizing:border-box;resize:none;font-family:inherit;"
              onfocus="this.style.borderColor='#2563eb'"
              onblur="this.style.borderColor='#e2e8f0'"
              oninput="document.getElementById('fb-char').textContent=this.value.length+'/500'">
            </textarea>
            <div style="text-align:right;font-size:11px;color:#94a3b8;margin-top:4px;"><span id="fb-char">0/500</span></div>
          </div>
          <button onclick="submitFeedback()" id="fb-submit-btn"
            style="background:#2563eb;color:white;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;width:100%;transition:background 0.2s;"
            onmouseover="this.style.background='#1d4ed8'"
            onmouseout="this.style.background='#2563eb'">
            Enviar Feedback
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var API_BASE = 'https://sports-platform-api.onrender.com';

    async function loadPDVNames() {
      try {
        var results = await Promise.all([
          fetch(API_BASE + '/api/cantina/pdv-info/1').then(function(r) { return r.json(); }),
          fetch(API_BASE + '/api/cantina/pdv-info/2').then(function(r) { return r.json(); }),
        ]);
        var pdv1 = results[0], pdv2 = results[1];
        if (pdv1 && pdv1.pdv_name) document.getElementById('pdv1-name').textContent = pdv1.pdv_name;
        if (pdv2 && pdv2.pdv_name) document.getElementById('pdv2-name').textContent = pdv2.pdv_name;
      } catch(e) {
        // Manter nomes padrão
      }
    }
    loadPDVNames();

    const SPONSORS = [
      {
        tier: 'OURO', emoji: '🥇', img: 'img/ouro.png', gold: true,
        color: '#f59e0b', colorLight: '#fef3c7', colorDark: '#d97706',
        glow: 'rgba(245,158,11,0.35)',
        bg: 'linear-gradient(145deg,#fffdf0,#ffffff,#fefce8)',
        border: '#f59e0b',
        navOn:  { bg:'rgba(245,158,11,0.9)', color:'#78350f', shadow:'0 4px 16px rgba(245,158,11,0.5)' },
        navOff: { bg:'#f1f5f9', color:'#64748b', shadow:'none' },
      },
      {
        tier: 'PRATA', emoji: '🥈', img: 'img/prata.png',
        color: '#9ca3af', colorLight: '#f3f4f6', colorDark: '#374151',
        glow: 'rgba(156,163,175,0.35)',
        bg: 'linear-gradient(145deg,#f9fafb,#ffffff,#f3f4f6)',
        border: '#9ca3af',
        navOn:  { bg:'rgba(209,213,219,0.95)', color:'#1f2937', shadow:'0 4px 16px rgba(156,163,175,0.5)' },
        navOff: { bg:'#f1f5f9', color:'#64748b', shadow:'none' },
      },
      {
        tier: 'BRONZE', emoji: '🥉', img: 'img/bronze.png',
        color: '#cd7c4a', colorLight: '#fff7ed', colorDark: '#7c2d12',
        glow: 'rgba(205,124,74,0.35)',
        bg: 'linear-gradient(145deg,#fff8f3,#ffffff,#fff1e6)',
        border: '#cd7c4a',
        navOn:  { bg:'rgba(205,124,74,0.9)', color:'#fff', shadow:'0 4px 16px rgba(205,124,74,0.5)' },
        navOff: { bg:'#f1f5f9', color:'#64748b', shadow:'none' },
      },
    ];

    SPONSORS.forEach((s, i) => {
      const el = document.getElementById('scard-' + i);
      if (!el) return;
      el.innerHTML = `
        <div style="padding:8px 0;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;">
          <span class="sponsor-badge" data-full="Patrocinador ${s.tier}" style="display:inline-block;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;${s.gold ? 'background:linear-gradient(90deg,#92400e 0%,#f59e0b 35%,#fde68a 50%,#f59e0b 65%,#92400e 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:goldShimmer 2.2s linear infinite;' : 'color:' + s.colorDark + ';'}"></span>
          <div style="position:relative;display:flex;align-items:center;justify-content:center;min-height:62px;">
            <img src="${s.img}" alt="${s.tier}" style="max-height:90px;max-width:85%;object-fit:contain;filter:drop-shadow(0 4px 12px ${s.glow});animation:floatImg 3s ease-in-out infinite;" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
            <span style="display:none;font-size:44px;">🏆</span>
            ${s.gold ? `
            <span style="position:absolute;width:4px;height:4px;border-radius:50%;background:#fbbf24;bottom:4px;left:22%;animation:sparkleRise 2.1s ease-in infinite;"></span>
            <span style="position:absolute;width:3px;height:3px;border-radius:50%;background:#fde68a;bottom:8px;left:42%;animation:sparkleRise 2.1s ease-in infinite 0.7s;"></span>
            <span style="position:absolute;width:5px;height:5px;border-radius:50%;background:#f59e0b;bottom:2px;left:60%;animation:sparkleRise 2.1s ease-in infinite 1.4s;"></span>
            <span style="position:absolute;width:3px;height:3px;border-radius:50%;background:#fde68a;bottom:6px;left:76%;animation:sparkleRise 2.1s ease-in infinite 0.35s;"></span>
            <span style="position:absolute;width:4px;height:4px;border-radius:50%;background:#fbbf24;bottom:0px;left:50%;animation:sparkleRise 2.1s ease-in infinite 1.05s;"></span>
            ` : ''}
          </div>
        </div>`;
    });

    let activeSponsor = 0;
    let sponsorTimer = null;
    let typewriterTimer = null;

    function typeBadge(el) {
      const chars = Array.from(el.dataset.full || '');
      el.textContent = '';
      if (typewriterTimer) { clearInterval(typewriterTimer); typewriterTimer = null; }
      let i = 0;
      typewriterTimer = setInterval(() => {
        i++;
        el.textContent = chars.slice(0, i).join('') + (i < chars.length ? '▌' : '');
        if (i >= chars.length) { clearInterval(typewriterTimer); typewriterTimer = null; }
      }, 55);
    }

    function showSponsor(index) {
      SPONSORS.forEach((_, i) => {
        const card = document.getElementById('scard-' + i);
        const nav  = document.getElementById('snav-' + i);
        const s    = SPONSORS[i];
        if (card) { card.style.opacity = '0'; card.style.transform = 'scale(0.97)'; card.style.pointerEvents = 'none'; }
        if (nav)  { nav.style.background = s.navOff.bg; nav.style.color = s.navOff.color; nav.style.boxShadow = s.navOff.shadow; nav.style.transform = 'scale(1)'; }
      });
      const activeCard = document.getElementById('scard-' + index);
      const activeNav  = document.getElementById('snav-' + index);
      const activeS    = SPONSORS[index];
      if (activeCard) {
        activeCard.style.opacity = '1'; activeCard.style.transform = 'scale(1)'; activeCard.style.pointerEvents = 'auto';
        const badge = activeCard.querySelector('.sponsor-badge');
        if (badge) setTimeout(() => typeBadge(badge), 120);
      }
      if (activeNav)  { activeNav.style.background = activeS.navOn.bg; activeNav.style.color = activeS.navOn.color; activeNav.style.boxShadow = activeS.navOn.shadow; activeNav.style.transform = 'scale(1.05)'; }
      activeSponsor = index;
    }

    function nextSponsor() { showSponsor((activeSponsor + 1) % SPONSORS.length); }

    function startSponsorTimer() { sponsorTimer = setInterval(nextSponsor, 4000); }
    function stopSponsorTimer()  { if (sponsorTimer) { clearInterval(sponsorTimer); sponsorTimer = null; } }

    const wrapper = document.getElementById('sponsors-wrapper');
    if (wrapper) {
      let tx = 0;
      wrapper.addEventListener('touchstart', e => { tx = e.touches[0].clientX; stopSponsorTimer(); }, { passive: true });
      wrapper.addEventListener('touchend', e => {
        const d = tx - e.changedTouches[0].clientX;
        if (Math.abs(d) > 40) showSponsor(d > 0 ? (activeSponsor + 1) % SPONSORS.length : (activeSponsor - 1 + SPONSORS.length) % SPONSORS.length);
        startSponsorTimer();
      }, { passive: true });
      wrapper.addEventListener('mouseenter', stopSponsorTimer);
      wrapper.addEventListener('mouseleave', startSponsorTimer);
    }

    showSponsor(0);
    startSponsorTimer();

    function openFeedbackModal() {
      document.getElementById('feedback-modal').style.display = 'flex';
      setTimeout(function() { document.getElementById('fb-name').focus(); }, 100);
    }

    function closeFeedbackModal() {
      document.getElementById('feedback-modal').style.display = 'none';
      document.getElementById('feedback-modal-body').innerHTML = document.getElementById('feedback-modal-body').innerHTML;
    }

    document.getElementById('feedback-modal').addEventListener('click', function(e) {
      if (e.target === this) closeFeedbackModal();
    });

    async function submitFeedback() {
      var name = document.getElementById('fb-name').value.trim();
      var message = document.getElementById('fb-message').value.trim();
      if (!name || !message) { alert('Por favor preencha seu nome e o feedback.'); return; }
      var btn = document.getElementById('fb-submit-btn');
      btn.textContent = 'Enviando...';
      btn.disabled = true;
      try {
        var res = await fetch(API_BASE + '/api/feedbacks/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, message: message })
        });
        if (!res.ok) throw new Error('Erro ao enviar');
        document.getElementById('feedback-modal-body').innerHTML = '<div style="text-align:center;padding:24px 16px;">'
          + '<div style="font-size:48px;margin-bottom:16px;">✅</div>'
          + '<div style="font-weight:700;font-size:18px;color:#1e293b;margin-bottom:8px;">Obrigado pelo feedback!</div>'
          + '<div style="color:#64748b;font-size:14px;margin-bottom:24px;">Sua opinião é muito importante. 🙂</div>'
          + '<button onclick="closeFeedbackModal()" style="background:#2563eb;color:white;border:none;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer;font-weight:600;">Fechar</button>'
          + '</div>';
      } catch(e) {
        btn.textContent = 'Enviar Feedback';
        btn.disabled = false;
        alert('Erro ao enviar. Tente novamente.');
      }
    }
  </script>
</body>
</html>
