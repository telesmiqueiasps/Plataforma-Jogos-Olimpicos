<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/logo.ico" type="image/x-icon">
  <title>Jogos Sinodal Paraíba 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; min-height: 100vh;
           background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #1d4ed8 100%); }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    @keyframes fadeSlideIn {
      0% { opacity: 0; transform: translateY(20px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeSlideOut {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-20px) scale(0.96); }
    }
    @keyframes glowGold {
      0%, 100% { box-shadow: 0 0 20px rgba(251,191,36,0.3), 0 8px 32px rgba(0,0,0,0.2); }
      50% { box-shadow: 0 0 40px rgba(251,191,36,0.6), 0 8px 32px rgba(0,0,0,0.2); }
    }
    @keyframes glowSilver {
      0%, 100% { box-shadow: 0 0 20px rgba(156,163,175,0.3), 0 8px 32px rgba(0,0,0,0.2); }
      50% { box-shadow: 0 0 40px rgba(156,163,175,0.6), 0 8px 32px rgba(0,0,0,0.2); }
    }
    @keyframes glowBronze {
      0%, 100% { box-shadow: 0 0 20px rgba(205,124,74,0.3), 0 8px 32px rgba(0,0,0,0.2); }
      50% { box-shadow: 0 0 40px rgba(205,124,74,0.6), 0 8px 32px rgba(0,0,0,0.2); }
    }
    @keyframes particles {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-60px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div style="text-align:center;padding:40px 20px 20px;">
    <div style="display:flex;align-items:center;justify-content:center;
                gap:12px;margin-bottom:8px;">
      <img src="img/logo.png" alt="Logo"
        style="width:48px;height:48px;object-fit:contain;
               border-radius:50%;border:2px solid rgba(255,255,255,0.25);"
        onerror="this.style.display='none'">
      <div style="text-align:left;">
        <h1 style="color:white;font-size:22px;font-weight:800;margin:0;
                   letter-spacing:-0.5px;line-height:1.2;">
          Jogos Sinodal PB
        </h1>
        <p style="color:rgba(255,255,255,0.7);font-size:13px;margin:0;">
          2026
        </p>
      </div>
    </div>
  </div>

  <!-- Patrocinadores -->
  <div style="max-width:480px;margin:0 auto 24px;padding:0 20px;">

    <!-- Título animado -->
    <div style="text-align:center;margin-bottom:16px;">
      <div style="display:inline-flex;align-items:center;gap:8px;
                  background:rgba(255,255,255,0.1);
                  border:1px solid rgba(255,255,255,0.2);
                  border-radius:20px;padding:5px 16px;">
        <span style="font-size:14px;">✨</span>
        <span style="color:rgba(255,255,255,0.9);font-size:11px;
                     letter-spacing:2px;text-transform:uppercase;font-weight:700;">
          Patrocinadores
        </span>
        <span style="font-size:14px;">✨</span>
      </div>
    </div>

    <!-- Card principal do patrocinador -->
    <div style="position:relative;" id="sponsor-container">

      <!-- Partículas decorativas -->
      <div id="particles-container" style="position:absolute;inset:0;
           pointer-events:none;overflow:hidden;border-radius:20px;z-index:0;"></div>

      <!-- Card do patrocinador ativo -->
      <div id="active-sponsor-card" style="position:relative;z-index:1;"></div>

    </div>

    <!-- Navegação por categoria -->
    <div style="display:flex;justify-content:center;gap:8px;margin-top:14px;">
      <button onclick="goToSponsor(0)" id="nav-0"
        style="display:flex;align-items:center;gap:5px;padding:6px 14px;
               border-radius:20px;border:none;cursor:pointer;
               font-size:11px;font-weight:700;letter-spacing:0.5px;
               transition:all 0.3s;background:rgba(251,191,36,0.9);color:#78350f;">
        🥇 OURO
      </button>
      <button onclick="goToSponsor(1)" id="nav-1"
        style="display:flex;align-items:center;gap:5px;padding:6px 14px;
               border-radius:20px;border:none;cursor:pointer;
               font-size:11px;font-weight:700;letter-spacing:0.5px;
               transition:all 0.3s;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);">
        🥈 PRATA
      </button>
      <button onclick="goToSponsor(2)" id="nav-2"
        style="display:flex;align-items:center;gap:5px;padding:6px 14px;
               border-radius:20px;border:none;cursor:pointer;
               font-size:11px;font-weight:700;letter-spacing:0.5px;
               transition:all 0.3s;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);">
        🥉 BRONZE
      </button>
    </div>

  </div>

  <!-- Cards de navegação -->
  <div style="max-width:480px;margin:0 auto;padding:20px;">

    <!-- Campeonatos -->
    <a href="public.html" style="text-decoration:none;display:block;margin-bottom:16px;">
      <div style="background:white;border-radius:16px;padding:24px;
                  display:flex;align-items:center;gap:16px;
                  box-shadow:0 4px 20px rgba(0,0,0,0.15);
                  transition:transform 0.2s;"
           onmouseover="this.style.transform='translateY(-2px)'"
           onmouseout="this.style.transform='translateY(0)'">
        <div style="width:56px;height:56px;background:#eff6ff;border-radius:14px;
                    display:flex;align-items:center;justify-content:center;
                    flex-shrink:0;">
          <img src="img/campeonatos.png" alt="Campeonatos" style="width:36px;height:36px;object-fit:contain;">
        </div>
        <div>
          <div style="font-weight:700;font-size:17px;color:#1e293b;">Campeonatos</div>
          <div style="color:#64748b;font-size:13px;margin-top:2px;">
            Tabelas, jogos e classificação
          </div>
        </div>
        <div style="margin-left:auto;color:#94a3b8;font-size:20px;">›</div>
      </div>
    </a>

    <!-- Cantina PDV 1 -->
    <a href="cantina-menu.html?pdv=1" style="text-decoration:none;display:block;margin-bottom:16px;">
      <div style="background:white;border-radius:16px;padding:24px;
                  display:flex;align-items:center;gap:16px;
                  box-shadow:0 4px 20px rgba(0,0,0,0.15);
                  transition:transform 0.2s;"
           onmouseover="this.style.transform='translateY(-2px)'"
           onmouseout="this.style.transform='translateY(0)'">
        <div style="width:56px;height:56px;background:#f0fdf4;border-radius:14px;
                    display:flex;align-items:center;justify-content:center;
                    flex-shrink:0;">
          <img src="img/cantina.png" alt="Cantina" style="width:36px;height:36px;object-fit:contain;">
        </div>
        <div>
          <div id="pdv1-name" style="font-weight:700;font-size:17px;color:#1e293b;">
            Cantina PDV 1
          </div>
          <div style="color:#64748b;font-size:13px;margin-top:2px;">
            Ver cardápio e fazer reserva
          </div>
        </div>
        <div style="margin-left:auto;color:#94a3b8;font-size:20px;">›</div>
      </div>
    </a>

    <!-- Cantina PDV 2 -->
    <a href="cantina-menu.html?pdv=2" style="text-decoration:none;display:block;margin-bottom:32px;">
      <div style="background:white;border-radius:16px;padding:24px;
                  display:flex;align-items:center;gap:16px;
                  box-shadow:0 4px 20px rgba(0,0,0,0.15);
                  transition:transform 0.2s;"
           onmouseover="this.style.transform='translateY(-2px)'"
           onmouseout="this.style.transform='translateY(0)'">
        <div style="width:56px;height:56px;background:#fef3c7;border-radius:14px;
                    display:flex;align-items:center;justify-content:center;
                    flex-shrink:0;">
          <img src="img/cantina.png" alt="Cantina" style="width:36px;height:36px;object-fit:contain;">
        </div>
        <div>
          <div id="pdv2-name" style="font-weight:700;font-size:17px;color:#1e293b;">
            Cantina PDV 2
          </div>
          <div style="color:#64748b;font-size:13px;margin-top:2px;">
            Ver cardápio e fazer reserva
          </div>
        </div>
        <div style="margin-left:auto;color:#94a3b8;font-size:20px;">›</div>
      </div>
    </a>

  </div>

  <!-- Botão de feedback -->
  <div style="text-align:center;padding:0 20px 24px;">
    <button onclick="openFeedbackModal()"
      style="background:transparent;border:1px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.7);padding:10px 24px;border-radius:20px;font-size:13px;cursor:pointer;letter-spacing:0.3px;transition:all 0.2s;"
      onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.color='white'"
      onmouseout="this.style.background='transparent';this.style.color='rgba(255,255,255,0.7)'">
      💬 Deixe aqui o seu feedback sobre a plataforma
    </button>
  </div>

  <!-- Footer -->
  <div style="text-align:center;padding:16px;color:rgba(255,255,255,0.5);font-size:12px;">
    Desenvolvido por Miquéias Teles
  </div>

  <!-- Modal de feedback -->
  <div id="feedback-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:20px;">
    <div style="background:white;border-radius:16px;width:100%;max-width:440px;overflow:hidden;">
      <!-- Header -->
      <div style="background:#2563eb;padding:20px 20px 16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="color:white;font-weight:700;font-size:16px;">💬 Feedback</div>
            <div style="color:rgba(255,255,255,0.75);font-size:12px;margin-top:2px;">Faz parte do meu portfólio. obrigado! 🙂</div>
          </div>
          <button onclick="closeFeedbackModal()"
            style="background:rgba(255,255,255,0.2);border:none;color:white;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;">
            ✕
          </button>
        </div>
      </div>
      <!-- Body -->
      <div id="feedback-modal-body" style="padding:20px;">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">Seu nome</label>
            <input type="text" id="fb-name" maxlength="100" placeholder="Como posso te chamar?"
              style="width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:14px;color:#374151;background:#f8fafc;outline:none;box-sizing:border-box;"
              onfocus="this.style.borderColor='#2563eb'"
              onblur="this.style.borderColor='#e2e8f0'">
          </div>
          <div>
            <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">Seu feedback</label>
            <textarea id="fb-message" maxlength="500" placeholder="O que achou da plataforma?" rows="4"
              style="width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:14px;color:#374151;background:#f8fafc;outline:none;box-sizing:border-box;resize:none;font-family:inherit;"
              onfocus="this.style.borderColor='#2563eb'"
              onblur="this.style.borderColor='#e2e8f0'"
              oninput="document.getElementById('fb-char').textContent=this.value.length+'/500'">
            </textarea>
            <div style="text-align:right;font-size:11px;color:#94a3b8;margin-top:4px;"><span id="fb-char">0/500</span></div>
          </div>
          <button onclick="submitFeedback()" id="fb-submit-btn"
            style="background:#2563eb;color:white;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;width:100%;transition:background 0.2s;"
            onmouseover="this.style.background='#1d4ed8'"
            onmouseout="this.style.background='#2563eb'">
            Enviar Feedback
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var API_BASE = 'https://sports-platform-api.onrender.com';

    async function loadPDVNames() {
      try {
        var results = await Promise.all([
          fetch(API_BASE + '/api/cantina/pdv-info/1').then(function(r) { return r.json(); }),
          fetch(API_BASE + '/api/cantina/pdv-info/2').then(function(r) { return r.json(); }),
        ]);
        var pdv1 = results[0], pdv2 = results[1];
        if (pdv1 && pdv1.pdv_name) document.getElementById('pdv1-name').textContent = pdv1.pdv_name;
        if (pdv2 && pdv2.pdv_name) document.getElementById('pdv2-name').textContent = pdv2.pdv_name;
      } catch(e) {
        // Manter nomes padrão
      }
    }
    loadPDVNames();

    const sponsors = [
      {
        id: 0,
        tier: 'OURO',
        emoji: '🥇',
        img: 'img/ouro.png',
        accent: '#f59e0b',
        accentLight: '#fef3c7',
        accentDark: '#92400e',
        accentGlow: 'rgba(251,191,36,0.4)',
        gradient: 'linear-gradient(135deg,#fffbeb 0%,#fff 50%,#fef9c3 100%)',
        shimmer: 'linear-gradient(90deg,transparent,rgba(251,191,36,0.15),transparent)',
        glowAnim: 'glowGold 2.5s ease-in-out infinite',
        borderGrad: 'linear-gradient(135deg,#f59e0b,#fbbf24,#f59e0b)',
        particleColor: '#fbbf24',
        navActive: 'background:rgba(251,191,36,0.9);color:#78350f;transform:scale(1.05);box-shadow:0 4px 15px rgba(251,191,36,0.4)',
        navInactive: 'background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.6)',
      },
      {
        id: 1,
        tier: 'PRATA',
        emoji: '🥈',
        img: 'img/prata.png',
        accent: '#9ca3af',
        accentLight: '#f3f4f6',
        accentDark: '#374151',
        accentGlow: 'rgba(156,163,175,0.4)',
        gradient: 'linear-gradient(135deg,#f9fafb 0%,#fff 50%,#f3f4f6 100%)',
        shimmer: 'linear-gradient(90deg,transparent,rgba(156,163,175,0.15),transparent)',
        glowAnim: 'glowSilver 2.5s ease-in-out infinite',
        borderGrad: 'linear-gradient(135deg,#9ca3af,#d1d5db,#9ca3af)',
        particleColor: '#d1d5db',
        navActive: 'background:rgba(209,213,219,0.9);color:#374151;transform:scale(1.05);box-shadow:0 4px 15px rgba(156,163,175,0.4)',
        navInactive: 'background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.6)',
      },
      {
        id: 2,
        tier: 'BRONZE',
        emoji: '🥉',
        img: 'img/bronze.png',
        accent: '#cd7c4a',
        accentLight: '#fff7ed',
        accentDark: '#7c2d12',
        accentGlow: 'rgba(205,124,74,0.4)',
        gradient: 'linear-gradient(135deg,#fff7ed 0%,#fff 50%,#ffedd5 100%)',
        shimmer: 'linear-gradient(90deg,transparent,rgba(205,124,74,0.15),transparent)',
        glowAnim: 'glowBronze 2.5s ease-in-out infinite',
        borderGrad: 'linear-gradient(135deg,#cd7c4a,#f97316,#cd7c4a)',
        particleColor: '#fb923c',
        navActive: 'background:rgba(205,124,74,0.9);color:#fff;transform:scale(1.05);box-shadow:0 4px 15px rgba(205,124,74,0.4)',
        navInactive: 'background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.6)',
      }
    ];

    let currentSponsor = 0;
    let autoplayTimer = null;
    let isTransitioning = false;
    let particleTimers = [];

    function createParticles(color) {
      const container = document.getElementById('particles-container');
      if (!container) return;
      container.innerHTML = '';
      particleTimers.forEach(t => clearTimeout(t));
      particleTimers = [];
      for (let i = 0; i < 8; i++) {
        const t = setTimeout(() => {
          if (!container.isConnected) return;
          const p = document.createElement('div');
          const size = Math.random() * 6 + 4;
          const left = Math.random() * 90 + 5;
          const duration = Math.random() * 1500 + 1000;
          const delay = Math.random() * 500;
          p.style.cssText = `position:absolute;bottom:10px;left:${left}%;width:${size}px;height:${size}px;background:${color};border-radius:50%;opacity:0.7;animation:particles ${duration}ms ease-out ${delay}ms forwards;pointer-events:none;`;
          container.appendChild(p);
          particleTimers.push(setTimeout(() => p.remove(), duration + delay + 100));
        }, i * 200);
        particleTimers.push(t);
      }
    }

    function renderSponsorCard(sponsor, animate) {
      const card = document.getElementById('active-sponsor-card');
      if (!card) return;
      card.innerHTML = `
        <div style="background:${sponsor.gradient};border-radius:20px;padding:28px 24px;position:relative;overflow:hidden;animation:${animate !== false ? 'fadeSlideIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards,' : ''}${sponsor.glowAnim};border:2px solid transparent;background-clip:padding-box;">
          <div style="position:absolute;inset:-2px;border-radius:22px;background:${sponsor.borderGrad};z-index:-1;"></div>
          <div style="position:absolute;inset:0;border-radius:20px;background:${sponsor.shimmer};background-size:200% auto;animation:shimmer 3s linear infinite;pointer-events:none;opacity:0.6;"></div>
          <div style="position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,${sponsor.accentGlow},transparent);pointer-events:none;"></div>
          <div style="position:absolute;bottom:-20px;left:-20px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,${sponsor.accentGlow},transparent);pointer-events:none;"></div>
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px;">
            <div style="display:flex;align-items:center;gap:6px;background:${sponsor.accentLight};border:1px solid ${sponsor.accent};border-radius:20px;padding:5px 14px;animation:pulse-ring 2s ease-in-out infinite;">
              <span style="font-size:16px;">${sponsor.emoji}</span>
              <span style="font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:${sponsor.accentDark};">Patrocinador ${sponsor.tier}</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;justify-content:center;min-height:90px;animation:floatUp 3s ease-in-out infinite;">
            <img src="${sponsor.img}" alt="Patrocinador ${sponsor.tier}" style="max-height:80px;max-width:80%;object-fit:contain;filter:drop-shadow(0 4px 12px ${sponsor.accentGlow});" onerror="this.parentElement.innerHTML='<span style=\\'font-size:48px;\\'>🏆</span>'">
          </div>
          <div style="margin-top:20px;height:3px;border-radius:2px;background:${sponsor.borderGrad};opacity:0.5;"></div>
        </div>`;
      createParticles(sponsor.particleColor);
    }

    function updateNavButtons(activeIndex) {
      sponsors.forEach((s, i) => {
        const btn = document.getElementById('nav-' + i);
        if (!btn) return;
        btn.setAttribute('style', btn.getAttribute('style').replace(/background:[^;]+;color:[^;]+(?:;transform:[^;]+)?(?:;box-shadow:[^;]+)?/, ''));
        if (i === activeIndex) {
          btn.style.cssText += ';' + s.navActive;
        } else {
          btn.style.cssText += ';' + s.navInactive;
        }
      });
    }

    function goToSponsor(index, resetTimer) {
      if (isTransitioning || index === currentSponsor) return;
      isTransitioning = true;
      const card = document.getElementById('active-sponsor-card');
      if (card) {
        card.style.animation = 'fadeSlideOut 0.3s ease forwards';
        setTimeout(() => {
          currentSponsor = index;
          renderSponsorCard(sponsors[index]);
          updateNavButtons(index);
          isTransitioning = false;
        }, 280);
      }
      if (resetTimer !== false) { stopSponsorAutoplay(); startSponsorAutoplay(); }
    }

    function startSponsorAutoplay() {
      autoplayTimer = setInterval(() => {
        const next = (currentSponsor + 1) % sponsors.length;
        goToSponsor(next, false);
        updateNavButtons(next);
      }, 4000);
    }

    function stopSponsorAutoplay() {
      if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
    }

    const sponsorContainer = document.getElementById('sponsor-container');
    if (sponsorContainer) {
      let touchStartX = 0;
      sponsorContainer.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        stopSponsorAutoplay();
      }, { passive: true });
      sponsorContainer.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) {
          goToSponsor(diff > 0
            ? (currentSponsor + 1) % sponsors.length
            : (currentSponsor - 1 + sponsors.length) % sponsors.length);
        }
        startSponsorAutoplay();
      }, { passive: true });
      sponsorContainer.addEventListener('mouseenter', stopSponsorAutoplay);
      sponsorContainer.addEventListener('mouseleave', startSponsorAutoplay);
    }

    renderSponsorCard(sponsors[0], false);
    updateNavButtons(0);
    startSponsorAutoplay();

    function openFeedbackModal() {
      document.getElementById('feedback-modal').style.display = 'flex';
      setTimeout(function() { document.getElementById('fb-name').focus(); }, 100);
    }

    function closeFeedbackModal() {
      document.getElementById('feedback-modal').style.display = 'none';
      document.getElementById('feedback-modal-body').innerHTML = document.getElementById('feedback-modal-body').innerHTML;
    }

    document.getElementById('feedback-modal').addEventListener('click', function(e) {
      if (e.target === this) closeFeedbackModal();
    });

    async function submitFeedback() {
      var name = document.getElementById('fb-name').value.trim();
      var message = document.getElementById('fb-message').value.trim();
      if (!name || !message) { alert('Por favor preencha seu nome e o feedback.'); return; }
      var btn = document.getElementById('fb-submit-btn');
      btn.textContent = 'Enviando...';
      btn.disabled = true;
      try {
        var res = await fetch(API_BASE + '/api/feedbacks/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, message: message })
        });
        if (!res.ok) throw new Error('Erro ao enviar');
        document.getElementById('feedback-modal-body').innerHTML = '<div style="text-align:center;padding:24px 16px;">'
          + '<div style="font-size:48px;margin-bottom:16px;">✅</div>'
          + '<div style="font-weight:700;font-size:18px;color:#1e293b;margin-bottom:8px;">Obrigado pelo feedback!</div>'
          + '<div style="color:#64748b;font-size:14px;margin-bottom:24px;">Sua opinião é muito importante. 🙂</div>'
          + '<button onclick="closeFeedbackModal()" style="background:#2563eb;color:white;border:none;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer;font-weight:600;">Fechar</button>'
          + '</div>';
      } catch(e) {
        btn.textContent = 'Enviar Feedback';
        btn.disabled = false;
        alert('Erro ao enviar. Tente novamente.');
      }
    }
  </script>
</body>
</html>
